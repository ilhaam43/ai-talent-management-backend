services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: ai-talent-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_talent_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ai-talent-network

  # Migration Job (runs once on startup: migrates database schema & seeds mock data)
  migration:
    image: node:20-slim
    container_name: ai-talent-migration
    working_dir: /usr/src/app
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/ai_talent_db?schema=public
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "rm -rf /var/lib/apt/lists/* && apt-get update && apt-get install -y --no-install-recommends ca-certificates openssl && rm -rf /var/lib/apt/lists/* && npm install --include=dev --legacy-peer-deps --ignore-scripts && npx prisma generate && npx prisma db push && npx tsx scripts/seed/seed-all.ts"
    restart: "no"
    networks:
      - ai-talent-network

  # NestJS Application in Development Mode (with hot-reloading)
  app:
    image: node:20-slim
    container_name: ai-talent-backend-app
    working_dir: /usr/src/app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/ai_talent_db?schema=public
      - JWT_SECRET=${JWT_SECRET:-supersecretjwt}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-supersecretjwtrefresh}
      - PORT=${PORT:-3000}
      - NODE_ENV=development
      - LLM_ENABLED=${LLM_ENABLED}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_MODEL=${LLM_MODEL}
      - LLM_TIMEOUT=${LLM_TIMEOUT}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS}
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL}
      - N8N_TALENT_POOL_WEBHOOK_URL=${N8N_TALENT_POOL_WEBHOOK_URL}
      - N8N_CHATBOT_WEBHOOK_URL=${N8N_CHATBOT_WEBHOOK_URL}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3001}
      - GMAIL_CLIENT_ID=${GMAIL_CLIENT_ID}
      - GMAIL_CLIENT_SECRET=${GMAIL_CLIENT_SECRET}
      - GMAIL_REFRESH_TOKEN=${GMAIL_REFRESH_TOKEN}
      - GMAIL_FROM_EMAIL=${GMAIL_FROM_EMAIL}
      - GMAIL_FROM_NAME=${GMAIL_FROM_NAME}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD}
      # MinIO Object Storage
      - MINIO_INTERNAL_ENDPOINT=http://minio:9000
      - MINIO_EXTERNAL_ENDPOINT=${MINIO_EXTERNAL_ENDPOINT:-http://localhost:9000}
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME:-ai-talent-documents}
      - MINIO_AVATARS_BUCKET=${MINIO_AVATARS_BUCKET:-ai-talent-avatars}
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
      - uploads:/usr/src/app/uploads
      - /root/.goclaw/workspace/a-l-i-c-e-solo:/root/.goclaw/workspace/a-l-i-c-e-solo
    ports:
      - "3000:3000"
    command: sh -c "rm -rf /var/lib/apt/lists/* && apt-get update && apt-get install -y --no-install-recommends ca-certificates python3 make g++ libcairo2-dev libjpeg-dev libpango1.0-dev libgif-dev libpixman-1-dev openssl wget && rm -rf /var/lib/apt/lists/* && npm install --include=dev --legacy-peer-deps --ignore-scripts && npx prisma generate && npm run start:dev"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/master/document-types || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - ai-talent-network

volumes:
  pgdata:
    driver: local
  uploads:
    driver: local


networks:
  ai-talent-network:
    driver: bridge