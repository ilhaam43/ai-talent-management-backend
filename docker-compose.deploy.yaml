services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: ai-talent-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_talent_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - ai-talent-network

  # Migration Job (runs once: migrate + seed)
  migration:
    image: node:20-slim
    container_name: ai-talent-migration
    working_dir: /usr/src/app
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/ai_talent_db?schema=public
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "rm -rf /var/lib/apt/lists/* && apt-get update && apt-get install -y --no-install-recommends ca-certificates openssl && rm -rf /var/lib/apt/lists/* && npm install --include=dev --legacy-peer-deps --ignore-scripts && npx prisma generate && npx prisma db push && npx tsx scripts/seed/seed-all.ts"
    restart: "no"
    networks:
      - ai-talent-network

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: ai-talent-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # S3 API — reachable by browser for presigned URLs
      # Console port NOT exposed in production — access via SSH tunnel if needed
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    networks:
      - ai-talent-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO Init — creates buckets and sets policies
  minio-init:
    image: minio/mc:latest
    container_name: ai-talent-minio-init
    depends_on:
      minio:
        condition: service_healthy
    restart: "on-failure:3"
    networks:
      - ai-talent-network
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME}
      MINIO_AVATARS_BUCKET: ${MINIO_AVATARS_BUCKET}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/$${MINIO_BUCKET_NAME};
      mc anonymous set none local/$${MINIO_BUCKET_NAME};
      mc mb --ignore-existing local/$${MINIO_AVATARS_BUCKET};
      mc anonymous set download local/$${MINIO_AVATARS_BUCKET};
      echo 'Buckets ready';
      "

  # NestJS Application
  app:
    image: node:20-slim
    container_name: ai-talent-backend-app
    restart: unless-stopped
    working_dir: /usr/src/app
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/ai_talent_db?schema=public
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - PORT=${PORT:-3000}
      - NODE_ENV=production
      - LLM_ENABLED=${LLM_ENABLED}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL}
      - LLM_MODEL=${LLM_MODEL}
      - LLM_TIMEOUT=${LLM_TIMEOUT}
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS}
      - N8N_WEBHOOK_URL=${N8N_WEBHOOK_URL}
      - N8N_TALENT_POOL_WEBHOOK_URL=${N8N_TALENT_POOL_WEBHOOK_URL}
      - N8N_CHATBOT_WEBHOOK_URL=${N8N_CHATBOT_WEBHOOK_URL}
      - FRONTEND_URL=${FRONTEND_URL}
      - GMAIL_CLIENT_ID=${GMAIL_CLIENT_ID}
      - GMAIL_CLIENT_SECRET=${GMAIL_CLIENT_SECRET}
      - GMAIL_REFRESH_TOKEN=${GMAIL_REFRESH_TOKEN}
      - GMAIL_FROM_EMAIL=${GMAIL_FROM_EMAIL}
      - GMAIL_FROM_NAME=${GMAIL_FROM_NAME}
      - GMAIL_APP_PASSWORD=${GMAIL_APP_PASSWORD}
      # MinIO Object Storage
      - MINIO_INTERNAL_ENDPOINT=http://minio:9000
      - MINIO_EXTERNAL_ENDPOINT=${MINIO_EXTERNAL_ENDPOINT}
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - MINIO_BUCKET_NAME=${MINIO_BUCKET_NAME}
      - MINIO_AVATARS_BUCKET=${MINIO_AVATARS_BUCKET}
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
      - uploads:/usr/src/app/uploads
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: sh -c "rm -rf /var/lib/apt/lists/* && apt-get update && apt-get install -y --no-install-recommends ca-certificates python3 make g++ libcairo2-dev libjpeg-dev libpango1.0-dev libgif-dev libpixman-1-dev openssl wget && rm -rf /var/lib/apt/lists/* && npm install --include=dev --legacy-peer-deps --ignore-scripts && npx prisma generate && npm run build && npm start"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/master/document-types || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - ai-talent-network

  # n8n Automation
  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: ai-talent-n8n
    restart: always
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Jakarta
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - ai-talent-network

volumes:
  pgdata:
    driver: local
  uploads:
    driver: local
  n8n_data:
    driver: local
  minio_data:
    driver: local

networks:
  ai-talent-network:
    driver: bridge
