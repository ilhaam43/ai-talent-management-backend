services:
  # NestJS Application (standalone — uses external PostgreSQL and MinIO)
  app:
    image: node:20-slim
    container_name: ai-talent-backend-app
    restart: unless-stopped
    working_dir: /usr/src/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - PORT=3001
      - NODE_ENV=production
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
      - uploads:/usr/src/app/uploads
      - /root/.goclaw/workspace/a-l-i-c-e-solo:/root/.goclaw/workspace/a-l-i-c-e-solo
    ports:
      - "3001:3001"
    command: sh -c "rm -rf /var/lib/apt/lists/* && apt-get update && apt-get install -y --no-install-recommends ca-certificates python3 make g++ libcairo2-dev libjpeg-dev libpango1.0-dev libgif-dev libpixman-1-dev openssl wget && rm -rf /var/lib/apt/lists/* && npm install --include=dev --legacy-peer-deps --ignore-scripts && npx prisma generate && npm run build && npm start"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3001/master/document-types || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - n8n_default

volumes:
  uploads:
    driver: local

networks:
  n8n_default:
    external: true
